[project]
name = "world-models-studies"
version = "0.1.0"
description = "Hands-on course: five generations of world models on CarRacing, from autoencoders to diffusion forcing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "gymnasium[box2d]>=1.3.0",
    "imageio>=2.37.4",
    "numpy>=2.4.4",
    "pytest>=9.1.1",
    "torch>=2.13.0",
    "tqdm>=4.66.5",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
